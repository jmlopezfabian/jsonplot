[project]
name = "jsonplot"
version = "0.1.0"
description = "A JSON contract plus a DataFrame renders a matplotlib or seaborn figure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
seaborn = ["seaborn>=0.13"]

[project.scripts]
jsonplot = "jsonplot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
